<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS DO PROJETO -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="wrapper d-flex">

        <aside class="sidebar d-flex flex-column p-3">

            <!-- LOGO -->
            <div class="logo mb-4 text-center">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="img-fluid">
            </div>

            <!-- MENU -->
            <nav class="nav flex-column flex-grow-1">

                <a href="{{ url_for('listar_clientes') }}"
                    class="nav-link {% if request.endpoint == 'listar_clientes' %}active fw-bold{% endif %}">
                    <i class="bi bi-people"></i> Clientes
                </a>

                <a href="{{ url_for('listar_produtos') }}"
                    class="nav-link {% if request.endpoint == 'listar_produtos' %}active fw-bold{% endif %}">
                    <i class="bi bi-clipboard-data"></i> Produtos
                </a>

                <a href="{{ url_for('movimentacoes') }}"
                    class="nav-link {% if request.endpoint == 'movimentacoes' %}active fw-bold{% endif %}">
                    <i class="bi bi-person-plus"></i> Movimentações
                </a>

                <a href="{{ url_for('nova_localizacao') }}"
                    class="nav-link {% if request.endpoint == 'nova_localizacao' %}active fw-bold{% endif %}">
                    <i class="bi bi-person-plus"></i> Localizações
                </a>

            </nav>

            <!-- FOOTER DA SIDEBAR -->
            <div class="mt-auto">
                <a href="{{ url_for('logout') }}" class="btn btn-danger w-100">
                    Sair
                </a>
            </div>

        </aside>

        <!-- CONTEÚDO -->
        <main class="content flex-fill p-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="m-0">Sistema de Gestão</h4>
            </div>

            <!-- MENSAGENS FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <!-- CONTEÚDO DINÂMICO -->
            {% block conteudo %}{% endblock %}

        </main>

    </div>

    <!-- JS SEGURO (não quebra se elemento não existir) -->
    <script>
        const produtoSelect = document.getElementById("produtoSelect");
        const quantidadeInput = document.getElementById("quantidade");
        const formPedido = document.getElementById("formPedido");

        let estoqueAtual = 0;

        if (produtoSelect) {
            produtoSelect.addEventListener("change", async function () {
                const id = this.value;
                if (!id) return;

                try {
                    const res = await fetch(`/api/produto/${id}`);
                    const data = await res.json();

                    estoqueAtual = data.quantidade;

                    document.getElementById("infoProduto").innerHTML = `
                    <div class="alert alert-info">
                        Estoque atual: <strong>${data.quantidade}</strong>
                    </div>
                `;
                } catch (e) {
                    console.error("Erro ao carregar produto");
                }
            });
        }

        if (quantidadeInput) {
            quantidadeInput.addEventListener("input", function () {
                const tipo = document.getElementById("tipo")?.value;
                const qtd = parseInt(this.value);

                if (tipo === "SAIDA" && qtd > estoqueAtual) {
                    this.classList.add("is-invalid");
                } else {
                    this.classList.remove("is-invalid");
                }
            });
        }

        if (formPedido) {
            formPedido.addEventListener("submit", async function (e) {
                e.preventDefault();

                const btn = document.getElementById("btnSalvar");
                if (btn) {
                    btn.innerText = "Salvando...";
                    btn.disabled = true;
                }

                const formData = new FormData(this);

                try {
                    const res = await fetch("/pedido/salvar", {
                        method: "POST",
                        body: formData
                    });

                    const data = await res.json();

                    if (data.erro) {
                        alert(data.erro);
                    } else {
                        location.reload();
                    }
                } catch (e) {
                    alert("Erro ao salvar pedido");
                }
            });
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
