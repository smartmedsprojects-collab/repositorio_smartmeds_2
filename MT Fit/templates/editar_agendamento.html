{% extends 'base.html' %}{% block title %}Editar agendamento · MT Fit{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">AGENDA</p><h1>Editar agendamento</h1><p class="text-secondary">Altere data, horário, observação ou plano.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('agendamentos') }}">Voltar</a></div><section class="panel narrow-panel"><form method="post" class="vstack gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="form-label">Plano / aluno</label><select class="form-select" name="planos_id" required>{% for plano in planos %}<option value="{{ plano.id }}" {% if plano.id == agendamento.planos_id %}selected{% endif %}>{{ plano.aluno_nome }} — {{ plano.descricao }}</option>{% endfor %}</select></div><div><label class="form-label">Data</label><input class="form-control" name="data" type="date" value="{{ agendamento.data.strftime('%Y-%m-%d') if agendamento.data.strftime is defined else agendamento.data }}" required></div><div><label class="form-label">Horário</label><input class="form-control" name="horario" type="time" value="{{ agendamento.horario|hora_hhmm }}" required></div><div><label class="form-label">Observação</label><textarea class="form-control" name="observacao" rows="3" required maxlength="100">{{ agendamento.observacao }}</textarea></div><button class="btn btn-primary">Salvar agendamento</button></form></section>{% endblock %}
