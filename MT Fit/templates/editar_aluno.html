{% extends 'base.html' %}{% block title %}Editar aluno · MT Fit{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">CADASTRO</p><h1>Editar aluno</h1><p class="text-secondary">Atualize os dados de {{ aluno.nome }}.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('alunos') }}">Voltar</a></div><section class="panel narrow-panel"><form method="post" class="vstack gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="form-label">Nome completo</label><input class="form-control" name="nome" value="{{ aluno.nome }}" required minlength="2" maxlength="100"></div><div><label class="form-label">Novo CPF</label><input class="form-control" name="cpf" placeholder="Digite novamente o CPF" required maxlength="14"><div class="form-text">Por segurança, o CPF não é exibido em texto aberto.</div></div><div><label class="form-label">E-mail</label><input class="form-control" name="email" type="email" value="{{ aluno.email }}" required maxlength="150"></div><div><label class="form-label">Telefone</label><input class="form-control" name="telefone" value="{{ aluno.telefone }}" required maxlength="20"></div><button class="btn btn-primary">Salvar alterações</button></form></section>{% endblock %}
