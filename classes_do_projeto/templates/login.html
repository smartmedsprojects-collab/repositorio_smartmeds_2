<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Sistema de Estoque</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body class="login-body">
    <div class="gradient min-vh-100">
        <div class="container d-flex justify-content-center align-items-center py-5">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 1000px; width: 100%;">

                <div class="row g-0">

                    <!-- LOGO -->
                    <div class="col-md-6 d-flex align-items-center justify-content-center bg-light p-4">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="img-fluid"
                            style="max-width: 350px;" />
                    </div>

                    <!-- FORM LOGIN -->
                    <div class="col-md-6 p-5">

                        <!-- TÍTULO -->
                        <div class="mb-4">
                            <h2 class="fw-bold text-dark">
                                Login
                            </h2>

                            <p class="text-muted mb-0">
                                Acesse sua conta no SmartMeds
                            </p>
                        </div>

                        <!-- MENSAGENS -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show">
                            {{ message }}

                            <button type="button" class="btn-close" data-bs-dismiss="alert">
                            </button>
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}

                        <!-- FORMULÁRIO -->
                        <form method="POST" action="{{ url_for('login') }}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    E-mail
                                </label>

                                <input type="email" name="email" class="form-control" placeholder="Digite seu e-mail"
                                    required />
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Senha
                                </label>

                                <input type="password" name="senha" class="form-control" placeholder="Digite sua senha"
                                    required />
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">
                                    Entrar
                                </button>
                            </div>

                        </form>

                        <!-- RODAPÉ -->
                        <div class="text-center mt-4">
                            <small class="text-muted">
                                © 2026 SENAI • Sistema SmartMeds
                            </small>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
