{% extends "base.html" %}{% block title %}Editar agendamento{% endblock %}{% block page_heading %}Editar agendamento{% endblock %}
{% block content %}<div class="section-intro"><div><div class="eyebrow">ORGANIZAÇÃO DE HORÁRIOS</div><h1 class="page-title">Alterar agendamento</h1><p class="page-subtitle">Atualize a data e o horário do compromisso.</p></div><a class="btn-secondary-custom" href="{{ url_for('agendamentos') }}"><i class="bi bi-arrow-left"></i> Voltar</a></div>
<div class="panel form-panel narrow-panel"><div class="appointment-edit-icon"><i class="bi bi-calendar2-week"></i></div><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-12"><label class="form-label" for="data_hora">Nova data e horário *</label><input class="form-control" type="datetime-local" id="data_hora" name="data_hora" required value="{{ agendamento.data_hora }}"></div><div class="col-12 d-flex justify-content-end gap-2"><a class="btn-secondary-custom" href="{{ url_for('agendamentos') }}">Cancelar</a><button class="btn-primary-custom compact" type="submit"><i class="bi bi-check2"></i> Salvar data</button></div></form></div>{% endblock %}
