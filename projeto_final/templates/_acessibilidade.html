<a class="access-skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

<div class="accessibility-widget" id="accessibilityWidget">
    <button class="accessibility-trigger" type="button" id="abrirAcessibilidade"
            aria-controls="painelAcessibilidade" aria-expanded="false"
            aria-label="Abrir painel de acessibilidade" title="Acessibilidade">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
            <circle cx="12" cy="7.5" r="1.5" fill="currentColor" />
            <path d="M6.5 10.5h11M12 10.5v8m0-5-4 5m4-5 4 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Acessibilidade</span>
    </button>

    <aside class="accessibility-panel" id="painelAcessibilidade"
           aria-labelledby="tituloAcessibilidade" aria-hidden="true" inert hidden>
        <div class="accessibility-header">
            <div>
                <h2 id="tituloAcessibilidade">Acessibilidade</h2>
                <p>Personalize sua navegação</p>
            </div>
            <button type="button" class="accessibility-close" id="fecharAcessibilidade"
                    aria-label="Fechar painel de acessibilidade">×</button>
        </div>

        <div class="accessibility-body">
            <section class="accessibility-section" aria-labelledby="tituloFonte">
                <h3 id="tituloFonte">Tamanho do texto</h3>
                <div class="accessibility-grid">
                    <button type="button" data-font="smaller" aria-label="Diminuir texto">A−</button>
                    <button type="button" data-font="normal" aria-label="Texto normal" aria-pressed="true">A</button>
                    <button type="button" data-font="larger" aria-label="Aumentar texto">A+</button>
                </div>
            </section>

            <section class="accessibility-section" aria-labelledby="tituloVisual">
                <h3 id="tituloVisual">Visualização</h3>
                <button type="button" class="accessibility-option" id="alternarContraste" aria-pressed="false">
                    <span class="accessibility-option-icon" aria-hidden="true">◐</span>
                    <span><strong>Alto contraste</strong><small>Facilita a leitura dos elementos</small></span>
                </button>
                <button type="button" class="accessibility-option" id="alternarMono" aria-pressed="false">
                    <span class="accessibility-option-icon" aria-hidden="true">◉</span>
                    <span><strong>Monocromático</strong><small>Visualização sem cores</small></span>
                </button>
            </section>

            <section class="accessibility-section" aria-labelledby="tituloLeitura">
                <h3 id="tituloLeitura">Leitura e navegação</h3>
                <button type="button" class="accessibility-option" id="leituraTab" aria-pressed="false">
                    <span class="accessibility-option-icon" aria-hidden="true">♧</span>
                    <span><strong>Ler ao navegar com Tab</strong><small>Anuncia o elemento em foco</small></span>
                </button>
                <button type="button" class="accessibility-option" id="lerPagina">
                    <span class="accessibility-option-icon" aria-hidden="true">▶</span>
                    <span><strong>Ler conteúdo da página</strong><small>Inicia a leitura em voz alta</small></span>
                </button>
                <button type="button" class="accessibility-option" id="pararLeitura">
                    <span class="accessibility-option-icon" aria-hidden="true">■</span>
                    <span><strong>Parar leitura</strong></span>
                </button>
            </section>

            <button type="button" class="accessibility-reset" id="restaurarAcessibilidade">
                Restaurar padrão
            </button>
            <p class="accessibility-status" id="statusAcessibilidade" role="status" aria-live="polite">
                Use Tab para navegar pelos controles e conteúdos.
            </p>
        </div>
    </aside>
</div>

<div class="accessibility-backdrop" id="fundoAcessibilidade" hidden></div>
